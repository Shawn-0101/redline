<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redline v1</title>
</head>
<body>
  <h1>Redline v1</h1>
  <p>Ping: <span id="ping">--</span> ms</p>
  <p>Download: <span id="speed">--</span> Mbps</p>
  <button id="go">Start</button>
  <p id="status"></p>

  <script>
    // Cloudflare's free endpoint: hands back however many bytes you ask for
    const URL = 'https://speed.cloudflare.com/__down?bytes=';

    async function testPing() {
      const times = [];
      for (let i = 0; i < 5; i++) {
        const start = performance.now();
        // ask for 0 bytes, so we only time the round trip
        // cache: 'no-store' stops the browser reusing an old response
        await fetch(URL + '0', { cache: 'no-store' });
        times.push(performance.now() - start);
      }
      times.sort((a, b) => a - b);
      return times[2]; // median, ignores one-off spikes
    }

    async function testDownload() {
      const start = performance.now();
      const res = await fetch(URL + '25000000', { cache: 'no-store' }); // 25 MB
      const reader = res.body.getReader(); // read the file chunk by chunk as it arrives

      let bytes = 0;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        bytes += value.length;

        // live speed so far: bytes -> bits, divide by seconds, then by a million
        const seconds = (performance.now() - start) / 1000;
        const mbps = (bytes * 8) / seconds / 1_000_000;
        document.getElementById('speed').textContent = mbps.toFixed(1);
      }
    }

    document.getElementById('go').addEventListener('click', async () => {
      const btn = document.getElementById('go');
      const status = document.getElementById('status');
      btn.disabled = true;
      try {
        status.textContent = 'Testing ping...';
        const ping = await testPing();
        document.getElementById('ping').textContent = Math.round(ping);

        status.textContent = 'Testing download...';
        await testDownload();
        status.textContent = 'Done';
      } catch (err) {
        status.textContent = 'Test failed: ' + err.message;
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
