<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redline v4</title>
</head>
<body>
  <h1>Redline v4</h1>
  <canvas id="gauge" width="400" height="400"></canvas>
  <p>Ping: <span id="ping">--</span> ms</p>
  <p>Download: <span id="speed">--</span> Mbps</p>
  <p>Average: <span id="avg">--</span> Mbps</p>
  <button id="go">Start</button>
  <p id="status"></p>

  <script>
    const URL = 'https://speed.cloudflare.com/__down?bytes=';
    const TEST_MS = 10000;
    const STREAMS = 4;
    const WINDOW_MS = 700;

    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

    // ---------- gearbox ----------
    // speed range (Mbps) for each gear: 1st is 0-10, 2nd 10-30 ... 6th 500+
    const GEARS = [0, 10, 30, 80, 200, 500, 1000];
    const TOP_GEAR = 6;
    const MAX_RPM = 8000, REDLINE = 7000, IDLE = 900;

    let gear = 0;          // 0 = neutral
    let lastShift = 0;     // time of last gear change
    let clutchUntil = 0;   // revs dip while this is in the future

    // where in the current gear's speed range are we? turn that into rpm
    function rpmFor(mbps, g) {
      const lo = GEARS[g - 1], hi = GEARS[g];
      const t = clamp((mbps - lo) / (hi - lo), 0, 1.1); // 0 = bottom of gear, 1 = top
      const base = g === 1 ? 1000 : 3500;                // after a shift revs drop to ~3500
      return base + t * (7000 - base);
    }

    function updateGear(mbps, now) {
      if (gear === 0 && mbps > 0.5) gear = 1;
      // upshift when we pass the top of this gear
      if (gear > 0 && gear < TOP_GEAR && mbps >= GEARS[gear] && now - lastShift > 400) {
        gear++;
        lastShift = now;
        clutchUntil = now + 230;
      }
      // downshift only once well below the bottom, so it doesn't flick back and forth
      else if (gear > 1 && mbps < GEARS[gear - 1] * 0.75 && now - lastShift > 700) {
        gear--;
        lastShift = now;
      }
    }

    // ---------- needle physics ----------
    let liveSpeed = 0;   // raw from the speed test
    let speed = 0;       // smoothed
    let rpm = 0, vel = 0;
    let running = false;

    // ---------- gauge ----------
    const canvas = document.getElementById('gauge');
    const ctx = canvas.getContext('2d');
    const START = Math.PI * 0.75, SWEEP = Math.PI * 1.5;
    const toAngle = r => START + (r / MAX_RPM) * SWEEP;

    function drawGauge() {
      const w = canvas.width, cx = w / 2, cy = w / 2, r = w * 0.45;
      ctx.clearRect(0, 0, w, w);

      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = '#111';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.85, START, START + SWEEP);
      ctx.strokeStyle = '#333';
      ctx.lineWidth = r * 0.06;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.85, toAngle(REDLINE), START + SWEEP);
      ctx.strokeStyle = '#d33';
      ctx.stroke();

      // 0-8 x1000 rpm
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `${r * 0.12}px sans-serif`;
      for (let i = 0; i <= 8; i++) {
        const a = toAngle(i * 1000);
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * r * 0.78, cy + Math.sin(a) * r * 0.78);
        ctx.lineTo(cx + Math.cos(a) * r * 0.92, cy + Math.sin(a) * r * 0.92);
        ctx.strokeStyle = i * 1000 >= REDLINE ? '#d33' : '#eee';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.fillStyle = i * 1000 >= REDLINE ? '#d33' : '#eee';
        ctx.fillText(i, cx + Math.cos(a) * r * 0.64, cy + Math.sin(a) * r * 0.64);
      }
      ctx.fillStyle = '#888';
      ctx.font = `${r * 0.06}px sans-serif`;
      ctx.fillText('RPM x1000', cx, cy - r * 0.3);

      // needle
      const a = toAngle(rpm);
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(a) * r * 0.9, cy + Math.sin(a) * r * 0.9);
      ctx.strokeStyle = '#f50';
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.08, 0, Math.PI * 2);
      ctx.fillStyle = '#444';
      ctx.fill();

      // gear + speed readout
      ctx.fillStyle = '#fa0';
      ctx.font = `bold ${r * 0.22}px sans-serif`;
      ctx.fillText(gear === 0 ? 'N' : gear, cx, cy + r * 0.38);
      ctx.fillStyle = '#eee';
      ctx.font = `${r * 0.09}px sans-serif`;
      ctx.fillText(speed.toFixed(1) + ' Mbps', cx, cy + r * 0.58);
    }

    let lastFrame = performance.now();
    function animate(now) {
      const dt = Math.min(0.05, (now - lastFrame) / 1000); // seconds since last frame
      lastFrame = now;

      // smooth out the 120ms jumps from the speed test
      speed += (liveSpeed - speed) * Math.min(1, dt * 4);

      // work out where the needle should be
      let target = 0;
      if (running) {
        updateGear(speed, now);
        target = gear === 0 ? IDLE : rpmFor(speed, gear);
        if (now < clutchUntil) target *= 0.85;     // revs dip during a shift
        target = clamp(target, IDLE, MAX_RPM - 200);
      }

      // spring: pull toward target, damping slows it down so it settles
      vel += ((target - rpm) * 90 - vel * 13) * dt;
      rpm += vel * dt;

      drawGauge();
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    // ---------- speed test ----------
    async function testPing() {
      const times = [];
      for (let i = 0; i < 5; i++) {
        const start = performance.now();
        await fetch(URL + '0', { cache: 'no-store' });
        times.push(performance.now() - start);
      }
      times.sort((a, b) => a - b);
      return times[2];
    }

    async function testDownload() {
      const ctrl = new AbortController();
      let bytes = 0;

      async function stream() {
        while (!ctrl.signal.aborted) {
          try {
            const res = await fetch(URL + '25000000', { cache: 'no-store', signal: ctrl.signal });
            const reader = res.body.getReader();
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              bytes += value.length;
            }
          } catch (err) {
            if (ctrl.signal.aborted) return;
            await sleep(250);
          }
        }
      }

      const history = [[performance.now(), 0]];
      const timer = setInterval(() => {
        const now = performance.now();
        history.push([now, bytes]);
        while (now - history[0][0] > WINDOW_MS) history.shift();
        const [t0, b0] = history[0];
        const mbps = (bytes - b0) * 8 / ((now - t0) / 1000) / 1e6;
        document.getElementById('speed').textContent = mbps.toFixed(1);
        liveSpeed = mbps;
      }, 120);

      const start = performance.now();
      const streams = Array.from({ length: STREAMS }, stream);
      await sleep(TEST_MS);
      ctrl.abort();
      clearInterval(timer);
      await Promise.allSettled(streams);

      return bytes * 8 / ((performance.now() - start) / 1000) / 1e6;
    }

    function stopEngine() {
      running = false;
      liveSpeed = 0;
      gear = 0;
    }

    document.getElementById('go').addEventListener('click', async () => {
      const btn = document.getElementById('go');
      const status = document.getElementById('status');
      btn.disabled = true;
      try {
        status.textContent = 'Testing ping...';
        document.getElementById('ping').textContent = Math.round(await testPing());

        status.textContent = 'Testing download...';
        running = true;
        const avg = await testDownload();
        document.getElementById('avg').textContent = avg.toFixed(1);
        status.textContent = 'Done';
      } catch (err) {
        status.textContent = 'Test failed: ' + err.message;
      }
      stopEngine();
      btn.disabled = false;
    });
  </script>
</body>
</html>
